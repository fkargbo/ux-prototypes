name: Deploy to GitHub Pages

on:
  push:
    branches:
      - ux-prototypes
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    # ExP-Lab reads VITE_* at bundle time. Secrets stored only on the `github-pages` **environment**
    # (common with Pages) are not visible to jobs unless they declare this environment — without it,
    # the shipped feedback-layer.js stays in local-only mode.
    environment:
      name: github-pages
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build
        env:
          NODE_ENV: production
          # GitHub project pages URL is /<repo-name>/ — keep assets and router in sync with the repo.
          GITHUB_PAGES_BASENAME: "/${{ github.event.repository.name }}"
          # Optional: full URL to feedback-layer.js (e.g. fkargbo Pages build with Supabase). Repo → Settings → Variables.
          EXP_LAB_FEEDBACK_SCRIPT_URL: ${{ vars.EXP_LAB_FEEDBACK_SCRIPT_URL }}

      - name: Build ExP-Lab feedback layer and copy to dist
        env:
          # Optional: if unset, exp-lab builds in local-only mode (browser storage only on Pages).
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}
        run: |
          if [ -z "${VITE_SUPABASE_URL}" ]; then
            echo "::warning::VITE_SUPABASE_URL is empty — add it under Settings → Secrets and variables → Actions (repository secret), or under the github-pages environment for this repo, then re-run deploy."
          else
            echo "VITE_SUPABASE_URL is set (value hidden)."
          fi
          if [ -z "${VITE_SUPABASE_ANON_KEY}" ]; then
            echo "::warning::VITE_SUPABASE_ANON_KEY is empty — add it the same way as VITE_SUPABASE_URL, then re-run deploy."
          else
            echo "VITE_SUPABASE_ANON_KEY is set (value hidden)."
          fi
          cd exp-lab
          npm ci
          npm run build
          cd ..
          cp -f exp-lab/dist/feedback-layer.js dist/feedback-layer.js

      - name: Setup Pages
        uses: actions/configure-pages@v4

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: './dist'

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
