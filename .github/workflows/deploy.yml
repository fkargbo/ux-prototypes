name: Deploy to GitHub Pages

on:
  push:
    branches:
      - ux-prototypes
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    # ExP-Lab bakes VITE_* at build time. Secrets on the `github-pages` environment (or duplicate
    # them as repository Actions secrets) are required for Supabase sync on Pages — not local-only.
    environment:
      name: github-pages
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build
        env:
          NODE_ENV: production
          # GitHub project pages URL is /<repo-name>/ — keep assets and router in sync with the repo.
          GITHUB_PAGES_BASENAME: "/${{ github.event.repository.name }}"
          # Optional: full URL to feedback-layer.js (e.g. fkargbo Pages build with Supabase). Repo → Settings → Variables.
          EXP_LAB_FEEDBACK_SCRIPT_URL: ${{ vars.EXP_LAB_FEEDBACK_SCRIPT_URL }}

      - name: Build ExP-Lab feedback layer and copy to dist
        env:
          # Optional: if unset, exp-lab builds in local-only mode (browser storage only on Pages).
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}
          # Optional override for OAuth return host (custom Pages domain). If empty, script defaults to
          # https://<repository_owner>.github.io so Supabase redirectTo matches user.github.io Pages.
          VITE_OAUTH_REDIRECT_ORIGIN: ${{ vars.VITE_OAUTH_REDIRECT_ORIGIN }}
        run: |
          if [ -z "${VITE_SUPABASE_URL}" ]; then
            echo "::error::VITE_SUPABASE_URL is empty — add it under Settings → Environments → github-pages → Environment secrets (or repository Actions secrets), then re-run deploy."
            exit 1
          else
            echo "VITE_SUPABASE_URL is set (value hidden)."
          fi
          if [ -z "${VITE_SUPABASE_ANON_KEY}" ]; then
            echo "::error::VITE_SUPABASE_ANON_KEY is empty — add it the same way as VITE_SUPABASE_URL, then re-run deploy."
            exit 1
          else
            echo "VITE_SUPABASE_ANON_KEY is set (value hidden)."
          fi
          if [ -z "${VITE_OAUTH_REDIRECT_ORIGIN}" ]; then
            export VITE_OAUTH_REDIRECT_ORIGIN="https://${GITHUB_REPOSITORY_OWNER}.github.io"
            echo "VITE_OAUTH_REDIRECT_ORIGIN default (owner Pages host): ${VITE_OAUTH_REDIRECT_ORIGIN}"
          else
            echo "VITE_OAUTH_REDIRECT_ORIGIN set from repository Variables."
          fi
          cd exp-lab
          npm ci
          npm run build
          cd ..
          cp -f exp-lab/dist/feedback-layer.js dist/feedback-layer.js

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: './dist'

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
